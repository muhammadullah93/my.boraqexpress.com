<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SellFlow Commerce OS — a responsive multi-channel ecommerce operations demo.">
<meta name="theme-color" content="#0f1f2e">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="site.webmanifest">
<title>SellFlow Commerce OS</title>
<style>
:root{--g:#16a36a;--g2:#0d7d51;--n:#0f1f2e;--a:#f6b73c;--bg:#f3f6f5;--card:#fff;--muted:#6b7b84;--line:#e2e9e6;--red:#df4f4f;--blue:#4777e8}*{box-sizing:border-box}body{margin:0;font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--n)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.side{background:var(--n);color:white;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;padding:0 10px 22px;font-size:19px;font-weight:800}.logo{width:34px;height:34px;border-radius:10px;background:var(--g);display:grid;place-items:center;color:white}.nav button{width:100%;border:0;background:transparent;color:#b8c5cc;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#203545;color:#fff}.nav i{font-style:normal;display:inline-block;width:26px}.sidefoot{position:absolute;bottom:18px;left:14px;right:14px;padding:12px;background:#1b3040;border-radius:10px;color:#b9c8d0;font-size:12px}.main{min-width:0}.top{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 25px;position:sticky;top:0;z-index:3}.search{flex:1;max-width:520px;background:#f3f6f5;border:1px solid var(--line);border-radius:9px;padding:10px 13px}.top select,.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px}.btn{cursor:pointer;font-weight:650}.btn.primary{background:var(--g);border-color:var(--g);color:#fff}.btn.dark{background:var(--n);color:#fff}.content{padding:25px}.demo{background:#fff7df;border:1px solid #f5dc94;color:#755716;padding:10px 14px;border-radius:9px;margin-bottom:18px;display:flex;justify-content:space-between}.titlebar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}.titlebar h1{margin:0;font-size:25px}.titlebar p{margin:5px 0 0;color:var(--muted)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 2px 8px #10251c08}.kpi small{color:var(--muted)}.kpi strong{font-size:25px;display:block;margin:8px 0}.up{color:var(--g);font-size:12px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}.card h3{margin:0 0 15px;font-size:15px}.chart{height:210px;display:flex;align-items:end;gap:12px;padding-top:15px}.bar{flex:1;background:linear-gradient(var(--g),#7ed7af);border-radius:7px 7px 2px 2px;position:relative;min-width:18px}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}.channels{display:grid;gap:13px}.channel{display:grid;grid-template-columns:90px 1fr 45px;gap:10px;align-items:center}.track{height:8px;background:#edf1ef;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--g);border-radius:99px}.tablecard{margin-top:14px;padding:0;overflow:hidden}.toolbar{padding:14px 16px;display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar input,.toolbar select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}.toolbar input{min-width:230px}.tabs{display:flex;gap:6px}.tab{border:0;background:#edf2ef;padding:8px 11px;border-radius:8px;cursor:pointer}.tab.active{background:#dff4e9;color:var(--g2);font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 15px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafcfb}tbody tr:hover{background:#fbfdfc}.badge{padding:5px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#edf2ef}.badge.green{background:#dff5e9;color:#087346}.badge.amber{background:#fff0cd;color:#916300}.badge.blue{background:#e6edff;color:#3158bb}.badge.red{background:#ffe5e5;color:#b93636}.split{display:grid;grid-template-columns:1fr 1.35fr;gap:14px}.scan{font-size:18px;padding:17px!important;width:100%;border:2px solid var(--g)!important;border-radius:11px}.queue{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.queue div{padding:13px;background:#f5f8f7;border-radius:10px}.queue strong{font-size:20px;display:block}.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.thumb{width:46px;height:50px;background:#dce8e3;border-radius:8px;display:grid;place-items:center;font-size:22px}.grow{flex:1}.view{display:none}.view.active{display:block}.modal{position:fixed;inset:0;background:#0f1f2e88;z-index:10;display:none;place-items:center;padding:20px}.modal.show{display:grid}.dialog{width:min(480px,100%);background:#fff;border-radius:15px;padding:22px;box-shadow:0 25px 70px #0004}.dialog h2{margin-top:0}.field{display:grid;gap:6px;margin:13px 0}.field input,.field select{padding:11px;border:1px solid var(--line);border-radius:8px}.toast{position:fixed;right:22px;bottom:22px;background:var(--n);color:white;padding:13px 17px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.25s;z-index:20}.toast.show{opacity:1;transform:none}.mobile{display:none}.muted{color:var(--muted)}@media(max-width:950px){.grid4{grid-template-columns:repeat(2,1fr)}.grid2,.split{grid-template-columns:1fr}.app{grid-template-columns:78px 1fr}.side{padding:18px 8px}.brand span,.nav button span,.sidefoot{display:none}.brand{padding-left:10px}.nav button{text-align:center;font-size:18px}.nav i{width:auto}.content{padding:18px}.top{padding:0 15px}.top select{display:none}}@media(max-width:620px){.app{display:block}.side{height:auto;position:fixed;z-index:8;bottom:0;top:auto;width:100%;padding:5px}.brand,.sidefoot{display:none}.nav{display:flex;overflow:auto}.nav button{min-width:62px;padding:9px 5px;margin:0}.main{padding-bottom:65px}.top{height:58px}.search{min-width:0}.grid4{grid-template-columns:1fr 1fr;gap:9px}.content{padding:12px}.kpi strong{font-size:19px}.queue{grid-template-columns:1fr 1fr}.tablecard{overflow:auto}.titlebar{align-items:start;gap:10px}.titlebar h1{font-size:21px}.demo span:last-child{display:none}}
</style>
</head>
<body><div class="app">
<aside class="side"><div class="brand"><div class="logo">S</div><span>SellFlow</span></div><nav class="nav" id="nav"></nav><div class="sidefoot">TapToSell integration<br><b style="color:#fff">Coming later</b></div></aside>
<main class="main"><header class="top"><input class="search" id="globalSearch" placeholder="Search orders, SKUs, customers…"><select id="store"><option>All stores</option><option>Shopee MY</option><option>TikTok Shop</option><option>Lazada MY</option></select><select id="currency"><option>MYR</option><option>BDT</option></select><button class="btn" onclick="toast('No new critical alerts')">🔔</button><button class="btn">MU</button></header>
<div class="content"><div class="demo"><span>⚠ Demo workspace — marketplace APIs not connected</span><span>Data refresh: just now</span></div><div id="views"></div></div></main></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Add product</h2><div id="modalBody"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveModal()">Save changes</button></div></div></div><div class="toast" id="toast"></div>
<script>
const orders=[['SF-10428','Shopee','Nur Aina','2','RM 129.80','Paid','To Ship'],['SF-10427','TikTok Shop','Amir Hakim','1','RM 69.90','COD','New'],['SF-10426','Lazada','Siti Mariam','3','RM 218.40','Paid','Shipped'],['SF-10425','Website','Jason Lim','1','RM 89.00','Paid','Delivered'],['SF-10424','Shopee','Farah Nadia','4','RM 346.50','Paid','To Ship'],['SF-10423','TikTok Shop','Muhammad Iqbal','2','RM 118.00','Paid','Packing'],['SF-10422','Lazada','Tan Wei Ming','1','RM 55.90','Paid','Return'],['SF-10421','Shopee','Aisyah Rahman','2','RM 149.80','COD','Delivered'],['SF-10420','Website','Rafiq Hasan','1','RM 79.00','Paid','Shipped'],['SF-10419','TikTok Shop','Nadia Yusuf','3','RM 199.70','Paid','New']];
const products=[['KC Denim Cargo Jogger','KC-DJ-02','5 channels',142,18,'RM 49.90'],['Essential Cotton Tee','SF-CT-11','4 channels',88,12,'RM 29.90'],['Kids Kurta Set','BK-KS-08','3 channels',34,9,'RM 69.90'],['Modest Active Hoodie','SF-AH-03','4 channels',16,8,'RM 89.00'],['Classic Chino Pants','SF-CP-07','5 channels',73,11,'RM 59.90'],['Travel Prayer Mat','SF-PM-04','3 channels',120,5,'RM 39.90'],['Canvas Tote Bag','SF-TB-09','2 channels',8,3,'RM 24.90'],['Premium Jubah','SF-JB-12','4 channels',27,6,'RM 119.00']];
const navItems=[['dashboard','▦','Dashboard'],['orders','▤','Orders'],['products','◫','Products'],['inventory','▥','Inventory'],['packing','▣','Packing'],['shipping','▰','Shipping'],['analytics','◒','Analytics'],['stores','◎','Stores'],['settings','⚙','Settings']];
document.getElementById('nav').innerHTML=navItems.map((n,i)=>`<button data-v="${n[0]}" class="${i?'':'active'}"><i>${n[1]}</i><span>${n[2]}</span></button>`).join('');
const title=(h,p,action='')=>`<div class="titlebar"><div><h1>${h}</h1><p>${p}</p></div>${action}</div>`;
const orderTable=()=>`<div class="tablecard card"><div class="toolbar"><input class="order-search" placeholder="Search order or customer"><div class="tabs"><button class="tab active" data-status="All">All</button><button class="tab" data-status="New">New</button><button class="tab" data-status="To Ship">To Ship</button><button class="tab" data-status="Shipped">Shipped</button></div><button class="btn" onclick="toast('Shipping labels prepared for print')">Print labels</button></div><div style="overflow:auto"><table><thead><tr><th>Order</th><th>Channel</th><th>Customer</th><th>Items</th><th>Amount</th><th>Payment</th><th>Status</th></tr></thead><tbody class="order-rows"></tbody></table></div></div>`;
const views={
dashboard:`${title('Good afternoon, Muhammad','Here’s what needs attention across your stores.','<button class="btn primary" onclick="toast(\'All stores syncing now\')">↻ Sync stores</button>')}<div class="grid4"><div class="card kpi"><small>Today’s revenue</small><strong>RM 18,420</strong><span class="up">↑ 12.4% vs yesterday</span></div><div class="card kpi"><small>Orders</small><strong>286</strong><span class="up">↑ 8.1% this week</span></div><div class="card kpi"><small>To ship</small><strong>74</strong><span class="badge amber">18 due soon</span></div><div class="card kpi"><small>Low stock</small><strong>12</strong><span class="badge red">Action needed</span></div></div><div class="grid2"><div class="card"><h3>7-day sales</h3><div class="chart">${[45,62,54,78,68,91,84].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${['Fri','Sat','Sun','Mon','Tue','Wed','Thu'][i]}</span></div>`).join('')}</div></div><div class="card"><h3>Sales by channel</h3><div class="channels">${[['Shopee',78,42],['TikTok',61,31],['Lazada',39,18],['Website',22,9]].map(x=>`<div class="channel"><b>${x[0]}</b><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><span>${x[2]}%</span></div>`).join('')}</div><h3 style="margin-top:25px">Operational alerts</h3><p>🟠 18 orders approach ship-by deadline</p><p>🔴 12 SKUs below reorder point</p><p>🟢 Store sync healthy</p></div></div>${orderTable()}`,
orders:`${title('Orders','Manage every channel from one queue.','<button class="btn primary" onclick="toast(\'Order import started\')">Import orders</button>')}${orderTable()}`,
products:`${title('Products','Central catalogue and channel listings.','<button class="btn primary" onclick="openModal(\'Add product\')">+ Add product</button>')}<div class="tablecard card"><div class="toolbar"><input placeholder="Search SKU or product"><button class="btn" onclick="toast('Import template ready')">Import products</button></div><div style="overflow:auto"><table><thead><tr><th>Product</th><th>SKU</th><th>Listings</th><th>Stock</th><th>Reserved</th><th>Available</th><th>Price</th></tr></thead><tbody>${products.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td>${p[4]}</td><td>${p[3]-p[4]}</td><td>${p[5]}</td></tr>`).join('')}</tbody></table></div></div>`,
inventory:`${title('Inventory','Live stock visibility across warehouses.','<button class="btn primary" onclick="openModal(\'Adjust stock\')">Adjust stock</button>')}<div class="grid4"><div class="card kpi"><small>Total units</small><strong>5,842</strong></div><div class="card kpi"><small>Reserved</small><strong>394</strong></div><div class="card kpi"><small>Low-stock SKUs</small><strong>12</strong></div><div class="card kpi"><small>Sync health</small><strong>99.8%</strong><span class="up">Healthy</span></div></div><div class="card tablecard"><div class="toolbar"><select><option>Kuala Lumpur Warehouse</option><option>Dhaka Warehouse</option></select><input placeholder="Search stock ledger"></div><table><thead><tr><th>SKU</th><th>Movement</th><th>Quantity</th><th>Balance</th><th>Reference</th><th>Time</th></tr></thead><tbody><tr><td>KC-DJ-02</td><td><span class="badge green">Order packed</span></td><td>-2</td><td>142</td><td>SF-10428</td><td>10:42</td></tr><tr><td>SF-AH-03</td><td><span class="badge blue">Restock</span></td><td>+20</td><td>16</td><td>PO-3021</td><td>09:18</td></tr><tr><td>SF-TB-09</td><td><span class="badge amber">Adjustment</span></td><td>-1</td><td>8</td><td>Cycle count</td><td>08:55</td></tr></tbody></table></div>`,
packing:`${title('Packing station','Scan an airway bill to start verification.')}<div class="split"><div><div class="card"><input class="scan" id="barcode" placeholder="▣ Scan barcode / AWB"><div class="queue"><div><small>Waiting</small><strong>24</strong></div><div><small>Packing</small><strong>3</strong></div><div><small>Packed</small><strong>86</strong></div><div><small>Exception</small><strong>2</strong></div></div><p class="muted">Tip: enter SF-10428 and press Enter</p></div><div class="card" style="margin-top:14px"><h3>PackProof evidence</h3><p><span class="badge green">● Recording ready</span></p><p>Staff: Farid • Station KL-02</p><p class="muted">Video attached to order • Retained for 30 days</p></div></div><div class="card"><h3>Active order <span class="badge blue">SF-10428</span></h3><div class="item"><div class="thumb">👖</div><div class="grow"><b>KC Denim Cargo Jogger</b><br><span class="muted">Mid Blue • Size 8 • Qty 1</span></div><button class="btn" onclick="this.textContent='✓ Verified';this.classList.add('primary')">Verify</button></div><div class="item"><div class="thumb">👕</div><div class="grow"><b>Essential Cotton Tee</b><br><span class="muted">Black • Size M • Qty 1</span></div><button class="btn" onclick="this.textContent='✓ Verified';this.classList.add('primary')">Verify</button></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="toast('Order packed; label ready')">Complete & print label</button></div></div>`,
shipping:`${title('Shipping','Labels, manifests and pickups.','<button class="btn primary" onclick="toast(\'Manifest created\')">Create manifest</button>')}${orderTable()}`,
analytics:`${title('Analytics','Revenue, profit and operational performance.')}<div class="grid4"><div class="card kpi"><small>Net revenue</small><strong>RM 128K</strong><span class="up">↑ 14.2%</span></div><div class="card kpi"><small>Gross profit</small><strong>RM 38.7K</strong></div><div class="card kpi"><small>Return rate</small><strong>2.4%</strong></div><div class="card kpi"><small>Avg. pack time</small><strong>2m 18s</strong></div></div><div class="grid2"><div class="card"><h3>Revenue trend</h3><div class="chart">${[32,48,41,59,68,73,88].map((h,i)=>`<div class="bar" style="height:${h}%"><span>W${i+1}</span></div>`).join('')}</div></div><div class="card"><h3>Top SKUs</h3>${products.slice(0,5).map((p,i)=>`<p><b>${i+1}. ${p[0]}</b><br><span class="muted">${p[1]} • ${121-i*17} sold</span></p>`).join('')}</div></div>`,
stores:`${title('Connected stores','Monitor channel sync and account status.','<button class="btn primary" onclick="openModal(\'Connect store\')">+ Connect store</button>')}<div class="grid4">${[['Shopee MY','● Connected','12:44'],['TikTok Shop','● Connected','12:43'],['Lazada MY','● Connected','12:41'],['Website','● Connected','Live']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="up">${x[1]}</p><p class="muted">Last sync: ${x[2]}</p><button class="btn" onclick="toast('${x[0]} syncing now')">↻ Sync now</button></div>`).join('')}</div>`,
settings:`${title('Settings','Workspace, people and integrations.')}<div class="grid2"><div class="card"><h3>Workspace</h3><div class="field"><label>Workspace name</label><input value="Boraq Express Operations"></div><div class="field"><label>Default currency</label><select><option>MYR — Malaysian Ringgit</option><option>BDT — Bangladeshi Taka</option></select></div><div class="field"><label>Language</label><select><option>English</option><option>বাংলা</option></select></div><button class="btn primary" onclick="toast('Workspace settings saved')">Save</button></div><div class="card"><h3>Integrations</h3><p><b>Marketplace APIs</b> <span class="badge amber">Approval required</span><br><span class="muted">Shopee, TikTok Shop and Lazada developer access.</span></p><p><b>PackProof</b> <span class="badge green">Demo connected</span><br><span class="muted">Packing video evidence and barcode verification.</span></p><p><b>TapToSell</b> <span class="badge">Coming later</span><br><span class="muted">Supplier and dropshipper operations.</span></p></div></div>`};
document.getElementById('views').innerHTML=Object.entries(views).map(([k,v])=>`<section id="${k}" class="view ${k==='dashboard'?'active':''}">${v}</section>`).join('');
function renderOrders(filter='All',q='',scope=document){const el=scope.querySelector('.order-rows');if(!el)return;const rows=orders.filter(o=>(filter==='All'||o[6]===filter)&&o.join(' ').toLowerCase().includes(q.toLowerCase()));el.innerHTML=rows.map(o=>`<tr onclick="toast('Opened ${o[0]} details')"><td><b>${o[0]}</b></td><td>${o[1]}</td><td>${o[2]}</td><td>${o[3]}</td><td>${o[4]}</td><td>${o[5]}</td><td><span class="badge ${o[6]==='Delivered'?'green':o[6]==='To Ship'?'amber':o[6]==='Return'?'red':'blue'}">${o[6]}</span></td></tr>`).join('')||'<tr><td colspan="7">No matching orders</td></tr>'}
function bindOrders(){document.querySelectorAll('.order-search').forEach(x=>x.oninput=()=>renderOrders('All',x.value,x.closest('.view')));document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{x.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));x.classList.add('active');renderOrders(x.dataset.status,'',x.closest('.view'))})}document.querySelectorAll('.view').forEach(v=>renderOrders('All','',v));bindOrders();
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.v).classList.add('active');renderOrders('All','',document.getElementById(b.dataset.v));bindOrders();scrollTo(0,0)});
document.getElementById('globalSearch').onkeydown=e=>{if(e.key==='Enter'){document.querySelector('[data-v="orders"]').click();setTimeout(()=>{const x=document.querySelector('#orders .order-search');x.value=e.target.value;x.dispatchEvent(new Event('input'))},10)}};
document.getElementById('currency').onchange=e=>toast('Currency changed to '+e.target.value);document.getElementById('store').onchange=e=>toast('Workspace filtered: '+e.target.value);document.addEventListener('keydown',e=>{if(e.target.id==='barcode'&&e.key==='Enter')toast('Order loaded and PackProof recording started')});
function toast(s){const t=document.getElementById('toast');t.textContent='✓ '+s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}function openModal(t){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML='<div class="field"><label>Name / reference</label><input placeholder="Enter value"></div><div class="field"><label>Warehouse</label><select><option>Kuala Lumpur Warehouse</option><option>Dhaka Warehouse</option></select></div>';document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function saveModal(){closeModal();toast('Changes saved in demo workspace')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
</script></body></html>
